content="Contact Kavya for internships, collaborations, and project opportunities.">

</head>

<body>

<header>

<nav aria-label="Primary Navigation">

<main id="main-content">

<section aria-labelledby="contact-heading">

<h1 id="contact-heading">
Contact Me
</h1>

<p>
Feel free to reach out regarding internships,
projects, collaborations, or technical discussions.
</p>

<form action="#" method="post">

<fieldset>

<legend>Contact Information</legend>

<label for="name">
Full Name
</label>

<input
type="text"
id="name"
name="name"
required
autocomplete="name">

<label for="email">
Email Address
</label>

<input
type="email"
id="email"
name="email"
required
autocomplete="email">

<label for="subject">
Subject
</label>

<input
type="text"
id="subject"
name="subject"
required>

<label for="message">
Message
</label>

<textarea
id="message"
name="message"
rows="6"
required>
</textarea>

<button type="submit">
Send Message
</button>

</fieldset>

</form>

</section>

</main>

<footer>
<p>
© 2025 Kavya
</p>
</footer>

</body>
</html>
